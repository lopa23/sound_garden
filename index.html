<style>
:root{--ink:#26344a;--muted:#68758a;--cream:#fffaf0;--paper:#fff;--pink:#ffddd5;--yellow:#ffe79a;--blue:#dff3ff;--mint:#daf4df;--purple:#eee5ff;--line:#e9e4d8;--green:#29945b;--shadow:0 12px 35px #34415a14}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}header{max-width:1150px;padding:20px 28px 10px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:22px}.logo{width:48px;height:48px;border-radius:16px;background:#ffe79a;display:grid;place-items:center;font-size:27px}.tiny{color:var(--muted);font-size:13px;font-weight:700}.sound{border:0;background:white;border-radius:99px;padding:12px 17px;box-shadow:var(--shadow);font-weight:800}main{max-width:1150px;margin:0 auto;padding:8px 28px 50px}.welcome{border-radius:28px;padding:25px 30px;background:linear-gradient(110deg,#dff3ff,#f4edff 67%,#fff0cf);display:flex;justify-content:space-between;align-items:center;gap:20px}.welcome h1{font-size:clamp(25px,4vw,38px);margin:0 0 7px}.welcome p{margin:0;color:#57657b;font-size:16px}.mascot{font-size:64px}.tabs{display:flex;gap:10px;overflow:auto;padding:19px 0 14px;scrollbar-width:none}.tab{border:2px solid transparent;border-radius:16px;background:white;padding:12px 16px;white-space:nowrap;font-weight:850;box-shadow:0 4px 12px #34415a0b}.tab.active{border-color:#5373d6;background:#eef1ff;color:#3654bd}.panel{background:var(--paper);border:1px solid var(--line);border-radius:27px;min-height:440px;padding:24px;box-shadow:var(--shadow)}.panelhead{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:18px}.panelhead h2{font-size:25px;margin:0 0 4px}.panelhead p{color:var(--muted);margin:0}.pill{background:#fff2c8;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:900;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.soundcard{background:#f8f9fc;border:2px solid #eceff5;border-radius:22px;min-height:177px;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.15s}.soundcard:active,.choice:active,.bigcard:active{transform:scale(.97)}.soundcard:hover{border-color:#b8c6ff;background:#f6f7ff}.grapheme{font-size:51px;line-height:1;font-weight:950;color:#4766cf;letter-spacing:-2px}.soundcard strong{font-size:19px}.soundcard small{color:var(--muted);font-weight:700}.round{width:34px;height:34px;border:0;border-radius:50%;background:#e7edff;color:#4461c5;font-size:17px}.game{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bigcard{border:0;border-radius:25px;min-height:205px;background:linear-gradient(140deg,#fff3cb,#ffe2dc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 0 0 2px #fff9}.bigcard .grapheme{font-size:73px}.question{font-size:23px;font-weight:900;margin:10px 0 15px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.choice{border:2px solid #e6eaf1;border-radius:18px;background:#fff;padding:14px;min-height:64px;font-size:22px;font-weight:900;transition:.15s}.choice:hover{border-color:#bbc9ff;background:#f6f7ff}.choice.correct{background:#e4f8e9;border-color:#62bd7a}.choice.wrong{background:#fff0ec;border-color:#ff9985}.action{border:0;border-radius:15px;padding:13px 18px;background:#526ed0;color:white;font-weight:900;box-shadow:0 6px 14px #526ed044}.soft{border:0;border-radius:15px;padding:12px 16px;background:#f0f2f8;font-weight:850}.actions{display:flex;justify-content:center;gap:10px;margin-top:17px;flex-wrap:wrap}.feedback{min-height:27px;text-align:center;font-size:19px;font-weight:900;margin:13px 0 0;color:var(--green)}.builder{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:22px 0}.slot{min-width:83px;width:auto;padding:0 14px;height:82px;border:3px dashed #cad2e5;background:#f8f9fc;border-radius:19px;display:grid;place-items:center;font-size:33px;font-weight:950;color:#4766cf}.slot.filled{border-style:solid;background:#f3f5ff}.lettertiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.letter{border:0;border-radius:17px;background:#e5f3ff;min-width:62px;min-height:62px;padding:12px;font-size:26px;font-weight:950;box-shadow:0 4px 10px #34415a12}.wordline{text-align:center;font-size:24px;font-weight:900;margin:10px}.progress{height:9px;background:#eef0f5;border-radius:99px;overflow:hidden;max-width:380px;margin:0 auto 18px}.progress i{display:block;background:#70c58c;height:100%;border-radius:99px;transition:width .3s}button:focus-visible{outline:3px solid #3654bd;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}.mastery{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}.mastery span{background:#f3f5fa;border-radius:10px;padding:5px 9px;font-size:14px;font-weight:850}.mastery .weak{background:#fff0ec}.mastery .strong{background:#e4f8e9}.rec{background:#e0465e;box-shadow:0 6px 14px #e0465e44}.heard{text-align:center;color:var(--muted);font-weight:700;min-height:22px}.part{border:0;background:#fff8;border-radius:16px;padding:2px 8px;margin:0 3px;font:inherit;color:#29384d;box-shadow:0 3px 0 #0001}.part.key{color:#4766cf;background:#fff}.part:hover{background:#fff}.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.bin{border:3px dashed #cad2e5;border-radius:22px;background:#f8f9fc;min-height:130px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;justify-content:center}.bin b{width:100%;text-align:center;font-size:34px;color:#4766cf}.bin span{background:#e4f8e9;border-radius:10px;padding:4px 9px;font-weight:850}.wordchip{border:2px solid #e6eaf1;border-radius:14px;background:#fff;padding:10px 14px;font-size:22px;font-weight:900}.wordchip.sel{border-color:#5373d6;background:#eef1ff}.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.sentence{font-size:28px;line-height:1.9;text-align:center;font-weight:800;max-width:700px;margin:10px auto}.hw{border:0;background:none;font:inherit;padding:2px 5px;border-radius:10px}.hw:hover{background:#f0f2f8}.hw.found{background:#e4f8e9;color:#1d7a46}.hw.no{background:#fff0ec}.blank{display:inline-block;min-width:1.6em;border-bottom:5px solid #4766cf;color:#4766cf}.foot{text-align:center;color:#8590a1;font-size:13px;margin-top:19px} @media(max-width:720px){header{padding:14px 16px}.tiny{display:none}main{padding:8px 14px 30px}.welcome{padding:21px;min-height:134px}.mascot{font-size:47px}.tabs{margin:0 -3px}.panel{padding:18px 14px;min-height:480px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.soundcard{min-height:148px}.grapheme{font-size:45px}.game{grid-template-columns:1fr;gap:8px}.bigcard{min-height:135px}.bigcard .grapheme{font-size:59px}.choices{gap:8px}.choice{font-size:19px}.panelhead h2{font-size:22px}}@media(min-width:720px){.game>.questionarea{padding:15px 12px}}
</style></head>
<body><header><div class="brand"><div class="logo">🌱</div><div>Sound Garden<div class="tiny">Little sounds grow into big words!</div></div></div><span class="pill" id="garden" title="Stars in your garden (all games)">🌻 0</span> <button class="sound" id="voiceBtn" aria-label="Toggle voice">🔊 Sound on</button></header>
<main><section class="welcome"><div><h1>Let’s grow our reading skills!</h1><p>Tap a sound, play a game, and watch your word garden grow.</p></div><div class="mascot" aria-hidden="true">🦋</div></section><nav class="tabs" id="tabs" aria-label="Activities"></nav><section class="panel" id="panel" aria-live="polite"></section><div class="foot">Grown with little steps 🌼 &nbsp;•&nbsp; Tap any card to hear its sound &nbsp;•&nbsp; <a href="privacy.html" style="color:inherit">Privacy</a></div></main>
<script>
const groups=[{name:'Digraphs (two letters, one sound)',items:[['sh','ship','shell','shop'],['ch','chip','chin','chop'],['th','think','three','thumb'],['th','that','this','them'],['wh','what','when','wheel'],['ph','phone','photo'],['ck','duck','back','lock'],['ng','ring','song','wing'],['kn','knee','knot'],['wr','write','wrap']]},{name:'L-blends',items:[['bl','blue','black'],['cl','clap','cloud'],['fl','flag','fly'],['gl','glad','glass'],['pl','play','plant'],['sl','slide','slow']]},{name:'R-blends',items:[['br','brown','brick'],['cr','crab','cry'],['dr','drop','drum'],['fr','frog','friend'],['gr','green','grass'],['tr','tree','train']]},{name:'S-blends',items:[['sk','skip','skate'],['sm','smile','small'],['sn','snake','snow'],['sp','spin','spot'],['st','star','stop'],['sw','swim','swing']]},{name:'Ending blends',items:[['nd','hand','pond','sand'],['nk','pink','sink','bank'],['nt','tent','plant','mint'],['mp','lamp','jump','camp'],['ft','gift','left','raft'],['ld','gold','child','cold'],['lp','help','gulp','yelp'],['sk','desk','mask','task']]},{name:'Vowel teams',items:[['ee','tree','feet','bee'],['ai','rain','train','snail'],['oa','boat','toast','goat'],['ay','day','play','hay'],['oo','moon','spoon','zoo'],['ea','beach','leaf','eat']]}];
const words=[['bl','ue','blue','🔵'],['sh','ell','shell','🐚'],['th','ree','three','3️⃣'],['ph','one','phone','📱'],['kn','ee','knee','🦵'],['lo','ck','lock','🔒'],['sn','ake','snake','🐍'],['sn','ow','snow','❄️'],['cl','oud','cloud','☁️'],['gl','ass','glass','🥛'],['pl','ant','plant','🌱'],['br','ick','brick','🧱'],['cr','y','cry','😢'],['tr','ee','tree','🌳'],['wr','ite','write','✍️'],['sw','im','swim','🏊'],['br','ush','brush','🪥'],['cl','ock','clock','⏰'],['cr','ab','crab','🦀'],['dr','um','drum','🥁'],['fl','ag','flag','🚩'],['fr','og','frog','🐸'],['gl','obe','globe','🌎'],['gr','apes','grapes','🍇'],['pl','ane','plane','✈️'],['sk','ate','skate','🛹'],['sl','ed','sled','🛷'],['sm','ile','smile','😊'],['sn','ail','snail','🐌'],['sp','oon','spoon','🥄'],['st','ar','star','⭐'],['sw','ing','swing','🎠'],['tr','ain','train','🚂'],['ch','ick','chick','🐥'],['sh','ip','ship','🚢'],['th','umb','thumb','👍'],['wh','ale','whale','🐳'],['du','ck','duck','🦆'],['ri','ng','ring','💍'],['ha','nd','hand','✋'],['la','mp','lamp','💡']];
let stars=0;try{stars=+localStorage.getItem('sg-stars')||0}catch(e){}function addStar(){stars++;try{localStorage.setItem('sg-stars',stars)}catch(e){}document.querySelector('#garden').textContent='🌻 '+stars}
let buildSeen=[];let tab=0,voice=true,round=0,score=0,answered=false,buildParts=[];const tabs=['👀 Sound cards','👂 Hear & find','🧩 Build a word','📖 Read it!','🗣️ Say it!','🗂️ Sort it','🔤 Missing sound','🔍 Sound hunt'];
const VOWEL={ee:'eee',ai:'ay',oa:'oh',ay:'ay',oo:'ooo',ea:'eee'},START={kn:'nnn',wr:'ruh',sm:'smmm',sn:'snnn',sh:'shhh',ph:'fff',wh:'wuh',ch:'chuh',th:'thuh',ng:'ing',ck:'kuh'};
function phon(s,w){if(s==='th'&&/^th(at|is|em)/.test(w||''))return 'thhh';if(VOWEL[s])return VOWEL[s];if(w&&!w.startsWith(s))return 'u'+s;return START[s]||s+'uh'}
function speak(text,rate=.8){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=rate;u.pitch=1.08;u.lang='en-US';speechSynthesis.speak(u)}function allItems(){return groups.flatMap(g=>g.items)}function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function wordSay(w){speak(w,.72)}
function setup(){document.querySelector('#tabs').innerHTML=tabs.map((x,i)=>`<button class="tab ${tab===i?'active':''}" data-tab="${i}" aria-current="${tab===i}">${x}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;round=0;answered=false;setup()});document.querySelector('#voiceBtn').textContent=voice?'🔊 Sound on':'🔇 Sound off';document.querySelector('#voiceBtn').onclick=()=>{voice=!voice;if(!voice)speechSynthesis?.cancel();setup()};document.querySelector('#garden').textContent='🌻 '+stars;if(!('speechSynthesis'in window)){voice=false;const v=document.querySelector('#voiceBtn');v.textContent='🔇 No voice on this device';v.disabled=true}render()}
function render(){const p=document.querySelector('#panel');if(tab===0){p.innerHTML=`<div class="panelhead"><div><h2>Sound cards</h2><p>Tap any card to hear the sound and a word that starts with it.</p></div><span class="pill">${allItems().length} sounds</span></div><div class="cards">${groups.map((g,gi)=>`<div style="grid-column:1/-1;font-weight:950;font-size:17px;margin:8px 2px 0">${g.name}</div>${g.items.map(([s,...ws])=>`<button class="soundcard" data-s="${s}" data-w="${ws.join(',')}" aria-label="${s}, as in ${ws.join(', ')}"><span class="grapheme">${s}</span><strong>${ws[0]}</strong><small>${ws.slice(1).join(' · ')}</small></button>`).join('')}`).join('')}</div>`;p.querySelectorAll('.soundcard').forEach(b=>b.onclick=()=>{{const ws=b.dataset.w.split(',');speak(phon(b.dataset.s,ws[0])+' ... '+ws.join(' ... '))};b.animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:240})});return}if(tab===1)matchGame(p);if(tab===2)buildGame(p);if(tab===3)readGame(p);if(tab===4)sayGame(p);if(tab===5)sortGame(p);if(tab===6)missGame(p);if(tab===7)huntGame(p)}
function matchGame(p){if(round===0&&answered===false)score=0;const item=pick(allItems()),opts=shuffle([item,...shuffle(allItems().filter(x=>x[0]!==item[0])).slice(0,3)]);p.innerHTML=`<div class="panelhead"><div><h2>Hear &amp; find</h2><p>Listen closely. Which letters make that sound?</p></div><span class="pill">⭐ ${score} stars</span></div><div class="progress"><i style="width:${(round%10)*10}%"></i></div><div class="game"><button class="bigcard" id="playPrompt"><span style="font-size:35px">🔊</span><strong style="font-size:21px">Tap to hear</strong><small>Listen for the sound</small></button><div class="questionarea"><div class="question">Which letters make the sound?</div><div class="choices">${opts.map(x=>`<button class="choice" data-a="${x[0]}">${x[0]}</button>`).join('')}</div></div></div><div class="feedback" id="feedback"></div><div class="actions"><button class="soft" id="repeat">🔁 Hear again</button><button class="action" id="next">Next sound →</button></div>`;const ps=phon(item[0],item[1]),play=()=>speak(ps+' ... like in '+item[1]);p.querySelector('#playPrompt').onclick=play;p.querySelector('#repeat').onclick=play;p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;if(b.dataset.a===item[0]){score++;addStar();b.classList.add('correct');p.querySelector('#feedback').textContent='Yes! '+item[0]+' as in '+item[1]+'! 🌟';speak('Yes! '+ps+' ... '+item[1])}else{b.classList.add('wrong');p.querySelector(`.choice[data-a="${item[0]}"]`).classList.add('correct');p.querySelector('#feedback').textContent='Good try! The sound is '+item[0]+'. 🌱';speak('Good try. '+ps+' ... '+item[1])}p.querySelector('.pill').textContent='⭐ '+score+' stars'});p.querySelector('#next').onclick=()=>{round++;answered=false;render()};if(!answered)setTimeout(play,350)}
function buildGame(p){if(!buildParts.length){let left=words.filter(w=>!buildSeen.includes(w[2]));if(!left.length){buildSeen=[];left=words}buildParts=pick(left)}const [a,b,full,emoji]=buildParts;if(!buildParts.tiles)buildParts.tiles=shuffle([a,b,pick(words.filter(w=>w[0]!==a&&w[1]!==b))[pick([0,1])]]);const tiles=buildParts.tiles;p.innerHTML=`<div class="panelhead"><div><h2>Build a word</h2><p>Tap the letter chunks in order. Put the beginning first!</p></div><span class="pill">🧩 Word builder</span></div><div class="question" style="text-align:center">${emoji} Make this word!</div><div class="builder"><div class="slot ${buildParts[4]?'filled':''}" id="slot0">${buildParts[4]||'?'}</div><div class="slot ${buildParts[5]?'filled':''}" id="slot1">${buildParts[5]||'?'}</div><button class="round" id="hearWord" aria-label="Hear word">🔊</button></div><div class="wordline">${buildParts[4]&&buildParts[5]?buildParts[4]+buildParts[5]: 'Tap a chunk'}</div><div class="lettertiles">${tiles.map(t=>`<button class="letter" data-t="${t}">${t}</button>`).join('')}</div><div class="feedback" id="feedback">${buildParts[4]&&buildParts[5]?'Great building! 🌟':''}</div><div class="actions"><button class="soft" id="clear">↩ Start over</button><button class="action" id="next">New word →</button></div>`;p.querySelector('#hearWord').onclick=()=>wordSay(full);p.querySelector('#clear').onclick=()=>{const t=buildParts.tiles;buildParts=[a,b,full,emoji];buildParts.tiles=t;render()};p.querySelector('#next').onclick=()=>{buildParts=[];render()};p.querySelectorAll('.letter').forEach(btn=>btn.onclick=()=>{if(buildParts[4]&&buildParts[5])return;const t=btn.dataset.t,idx=buildParts[4]?5:4,expected=idx===4?a:b;if(t===expected){buildParts[idx]=t;render();if(buildParts[4]&&buildParts[5]){addStar();buildSeen.push(full);document.querySelector('#feedback').textContent='You made '+full+'! 🎉 New word coming…';wordSay(full);const cur=buildParts;setTimeout(()=>{if(tab===2&&buildParts===cur){buildParts=[];render()}},2200)}}else{p.querySelector('#feedback').textContent='Almost! Try the other chunk.';speak('Try again')}})}
const REST={ell:'ell',ree:'ree',one:'own',ee:'ee',ake:'ache',ow:'oh',oud:'owd',ass:'ass',ant:'ant',y:'eye',ite:'ight',im:'im',ue:'oo',lo:'lah',ock:'ock',ush:'ush',ab:'abb',um:'umm',ag:'agg',og:'ogg',obe:'ohb',apes:'apes',ane:'ain',ate:'ate',ed:'ed',ile:'isle',ail:'ale',oon:'oon',ar:'are',ing:'ing',ain:'ain',ick:'ick',ip:'ip',umb:'umm',ale:'ale',du:'duh',ri:'rih',ha:'ha',la:'lah'};
const G=new Set(groups.flatMap(g=>g.items.map(i=>i[0])));
function readGame(p){if(round===0)score=0;const item=pick(words),opts=shuffle([item,...shuffle(words.filter(x=>x[2]!==item[2])).slice(0,3)]);p.innerHTML=`<div class="panelhead"><div><h2>Read the word</h2><p>Look at the sound at the start. Tap the picture that matches!</p></div><span class="pill">⭐ ${score} stars</span></div><div class="game"><div class="bigcard" id="readCard"><span class="grapheme" style="font-size:58px">${[item[0],item[1]].map((x,i)=>`<button class="part ${G.has(x)?'key':''}" data-i="${i}" aria-label="sound ${x}">${x}</button>`).join('')}</span><small>Tap each part to hear its sound</small></div><div class="questionarea"><div class="question">Which picture is a <b>${item[2]}</b>?</div><div class="choices">${opts.map(x=>`<button class="choice" style="font-size:42px" data-a="${x[2]}" aria-label="${x[2]}">${x[3]}</button>`).join('')}</div></div></div><div class="feedback" id="feedback"></div><div class="actions"><button class="action" id="next">Next word →</button></div>`;const play=()=>wordSay(item[2]);p.querySelectorAll('.part').forEach(btn=>btn.onclick=()=>{const x=item[+btn.dataset.i];speak(G.has(x)?phon(x,item[2]):(REST[x]||x),.7);btn.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:260})});p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;if(b.dataset.a===item[2]){score++;addStar();b.classList.add('correct');p.querySelector('#feedback').textContent='That’s right! You read '+item[2]+'! 🎉';speak('Yes!')}else{b.classList.add('wrong');p.querySelector(`.choice[data-a="${item[2]}"]`).classList.add('correct');p.querySelector('#feedback').textContent='The word is '+item[2]+'. Let’s read it together! 🌱';speak('Good try')}p.querySelector('.pill').textContent='⭐ '+score+' stars'});p.querySelector('#next').onclick=()=>{round++;answered=false;render()};}

let mastery={},sayItem=null,sayLast=null,sayDone=false;try{mastery=JSON.parse(localStorage.getItem('sg-mastery'))||{}}catch(e){}
function mark(k,ok){const m=mastery[k]||(mastery[k]={ok:0,miss:0});ok?m.ok++:m.miss++;try{localStorage.setItem('sg-mastery',JSON.stringify(mastery))}catch(e){}}
function pickSay(){const pool=words.filter(w=>w!==sayLast),wt=pool.map(w=>{const m=mastery[w[0]]||{ok:0,miss:0};return (m.miss*2+1)/(m.ok+1)});let r=Math.random()*wt.reduce((a,b)=>a+b,0);for(let i=0;i<pool.length;i++){r-=wt[i];if(r<=0)return pool[i]}return pool[0]}
function sayGame(p){if(!sayItem){sayItem=pickSay();sayDone=false}const [a,b,full,emoji]=sayItem,keys=[...new Set(words.map(w=>w[0]))].filter(k=>mastery[k]).sort((x,y)=>(mastery[y].miss-mastery[y].ok)-(mastery[x].miss-mastery[x].ok)).slice(0,10);
p.innerHTML=`<div class="panelhead"><div><h2>Say it!</h2><p>Read the word out loud, then tap how it went.</p></div><span class="pill">${emoji}</span></div><div class="bigcard" style="max-width:420px;margin:0 auto"><span class="grapheme" style="font-size:66px">${a}<span style="color:#29384d">${b}</span></span></div><div class="feedback" id="feedback"></div><div class="actions"><button class="soft" id="hear">🔊 Hear it</button><button class="action" id="next">Next word →</button></div><div class="actions" id="self"><button class="soft" id="selfOk">👍 I said it right</button><button class="soft" id="selfNo">🔁 Needs practice</button></div>`;
const fb=p.querySelector('#feedback'),judge=ok=>{if(sayDone)return;sayDone=true;mark(a,ok);if(ok){addStar();fb.style.color='';fb.textContent='Great reading! '+full+'! 🌟';speak('Great reading!')}else{fb.style.color='#c4532f';fb.textContent='Let’s practice '+a+'. Listen: '+full;speak(phon(a,full)+' ... '+full,.7)}p.querySelector('#self').hidden=true;p.querySelector('#next').focus()};
p.querySelector('#hear').onclick=()=>wordSay(full);p.querySelector('#next').onclick=()=>{sayLast=sayItem;sayItem=null;render()};p.querySelector('#selfOk').onclick=()=>judge(true);p.querySelector('#selfNo').onclick=()=>judge(false);}

let sortSt=null;function sortGame(p){if(!sortSt){const ks=[...new Set(allItems().map(i=>i[0]))],a=pick(ks),b=pick(ks.filter(k=>k!==a)),ws=k=>[...new Set(allItems().filter(i=>i[0]===k).flatMap(i=>i.slice(1)))].filter(w=>w.includes(k)&&!w.includes(k===a?b:a));sortSt={a,b,left:shuffle([...shuffle(ws(a)).slice(0,3).map(w=>[w,a]),...shuffle(ws(b)).slice(0,3).map(w=>[w,b])]),done:{[a]:[],[b]:[]},sel:null}}const S=sortSt;
p.innerHTML=`<div class="panelhead"><div><h2>Sort it</h2><p>Tap a word, then tap the box with its sound.</p></div><span class="pill">🗂️ ${S.a} or ${S.b}?</span></div><div class="lettertiles">${S.left.map(([w],i)=>`<button class="wordchip ${S.sel===i?'sel':''}" data-i="${i}">${w}</button>`).join('')}</div><div class="bins">${[S.a,S.b].map(k=>`<button class="bin" data-k="${k}" aria-label="${k} box"><b>${k}</b>${S.done[k].map(w=>`<span>${w}</span>`).join('')}</button>`).join('')}</div><div class="feedback" id="feedback">${S.left.length?'':'All sorted! 🎉'}</div><div class="actions"><button class="action" id="next">New words →</button></div>`;
p.querySelectorAll('.wordchip').forEach(c=>c.onclick=()=>{S.sel=+c.dataset.i;speak(S.left[S.sel][0],.75);render()});p.querySelectorAll('.bin').forEach(bn=>bn.onclick=()=>{if(S.sel===null){speak(phon(bn.dataset.k,'')) ;return}const [w,k]=S.left[S.sel];if(k===bn.dataset.k){S.done[k].push(w);S.left.splice(S.sel,1);S.sel=null;if(!S.left.length){addStar();speak('All sorted!')}render()}else{bn.classList.add('shake');setTimeout(()=>bn.classList.remove('shake'),300);speak('Try the other box')}});p.querySelector('#next').onclick=()=>{sortSt=null;render()}}
let missSt=null;function missGame(p){if(!missSt){const w=pick(words.filter(x=>G.has(x[0])||G.has(x[1]))),gi=G.has(w[0])?0:1,ans=w[gi],pool=[...new Set(allItems().map(i=>i[0]))].filter(k=>k!==ans&&k[0]!==ans[0]===false||k!==ans);missSt={w,gi,ans,opts:shuffle([ans,...shuffle(pool.filter(k=>k!==ans)).slice(0,2)]),done:false}}const M=missSt,[a,b,full,emoji]=M.w,shown=M.gi===0?`<span class="blank">${M.done?a:'&nbsp;'}</span>${b}`:`${a}<span class="blank">${M.done?b:'&nbsp;'}</span>`;
p.innerHTML=`<div class="panelhead"><div><h2>Missing sound</h2><p>Look at the picture. Which sound is missing ${M.gi===0?'at the start':'at the end'}?</p></div><span class="pill">${emoji}</span></div><div class="bigcard" style="max-width:420px;margin:0 auto"><span style="font-size:60px">${emoji}</span><span class="grapheme" style="font-size:56px;color:#29384d">${shown}</span></div><div class="choices" style="max-width:420px;margin:16px auto 0;grid-template-columns:repeat(3,1fr)">${M.opts.map(o=>`<button class="choice" data-o="${o}">${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="action" id="next">Next picture →</button></div>`;
p.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{if(M.done)return;const o=c.dataset.o;if(o===M.ans){M.done=true;addStar();speak(phon(o,full)+' ... '+full);render();p.querySelector('#feedback').textContent='Yes! '+full+' 🌟';setTimeout(()=>{if(missSt===M&&tab===6){missSt=null;render()}},2200)}else{c.classList.add('wrong');speak(phon(o,full)+'? Try again')}});p.querySelector('#next').onclick=()=>{missSt=null;render()}}
const HUNT=[['sh','The fish in the shop has a shell and a ship.'],['ch','Chip the chick ate lunch on a chair.'],['th','Three thin moths think in the bath.'],['st','Stan stops to look at the star on the step.'],['bl','The black cat has a blue blanket.'],['fr','A frog and his friend eat fresh fruit.'],['sn','The snake and the snail play in the snow.'],['ck','The duck kicks a sock by the dock.'],['wh','When will the white whale come?'],['tr','The truck drives by a tree near the train.'],['ng','The king can sing a long song.'],['sw','We swim and swing in the sweet sun.']];
let huntSt=null;function huntGame(p){if(!huntSt){const [t,sen]=pick(HUNT.filter(h=>h!==huntSt?.h));const ws=sen.split(' ');huntSt={t,ws,found:new Set(),need:ws.filter(w=>w.toLowerCase().includes(t)).length}}const H=huntSt;
p.innerHTML=`<div class="panelhead"><div><h2>Sound hunt</h2><p>Find every word with <b>${H.t}</b>. Tap them!</p></div><span class="pill">🔍 ${H.found.size} / ${H.need}</span></div><div class="bigcard" style="max-width:260px;margin:0 auto;min-height:120px" id="tgt"><span class="grapheme">${H.t}</span><small>tap to hear</small></div><p class="sentence">${H.ws.map((w,i)=>`<button class="hw ${H.found.has(i)?'found':''}" data-i="${i}">${w}</button>`).join(' ')}</p><div class="feedback" id="feedback">${H.found.size===H.need?'You found them all! 🎉':''}</div><div class="actions"><button class="action" id="next">New sentence →</button></div>`;
p.querySelector('#tgt').onclick=()=>speak(phon(H.t,''));p.querySelectorAll('.hw').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,w=H.ws[i].replace(/\W/g,'');if(w.toLowerCase().includes(H.t)){if(H.found.has(i))return;H.found.add(i);speak(w,.75);if(H.found.size===H.need){addStar();speak('You found them all!')}render()}else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);speak(w+'? No '+phon(H.t,''),.8)}});p.querySelector('#next').onclick=()=>{huntSt=null;render()}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setup();
</script></body></html>
